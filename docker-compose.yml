services:
  db:
    image: postgres:16-alpine
    container_name: pmtb-db
    command: >
      postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pmtb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmtb-network

  redis:
    image: redis:7-alpine
    container_name: pmtb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmtb-network

  minio:
    image: minio/minio:latest
    container_name: pmtb-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bucket_data:/data
    networks:
      - pmtb-network
    healthcheck:
      test: ["CMD", "mc", "mb", "local/prefeitura"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmtb-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pmtb}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: prefeitura
      S3_REGION: us-east-1
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - bucket_data:/app/uploads
    networks:
      - pmtb-network
    command: npm run start:dev

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: pmtb-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:3001
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   networks:
  #     - pmtb-network
  #   command: pnpm run dev

networks:
  pmtb-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bucket_data:
  esdata:
