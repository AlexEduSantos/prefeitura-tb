services:
  db:
    image: postgres:15-alpine
    container_name: pmtb-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pmtb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmtb-network
  
  redis:
    image: redis:7-alpine
    container_name: pmtb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmtb-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmtb-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pmtb}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - bucket_data:/app/uploads
    networks:
      - pmtb-network
    command: pnpm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pmtb-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - pmtb-network
    command: pnpm run dev

networks:
  pmtb-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bucket_data:
