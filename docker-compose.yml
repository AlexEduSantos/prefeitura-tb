services:
  db:
    image: postgres:16-alpine
    container_name: pmtb-db
    command: >
      postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmtb-network

  redis:
    image: redis:7-alpine
    container_name: pmtb-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pmtb-network

  minio:
    image: minio/minio:latest
    container_name: pmtb-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - bucket_data:/data
    networks:
      - pmtb-network
    healthcheck:
      test: ["CMD", "mc", "mb", "local/prefeitura"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmtb-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-prefeitura}
      S3_REGION: ${S3_REGION:-us-east-1}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET}
      UMAMI_API_URL: ${UMAMI_API_URL:-http://umami:3000}
      UMAMI_API_KEY: ${UMAMI_API_KEY}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      UMAMI_USERNAME: ${UMAMI_USERNAME}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - pmtb-network
    command: npm run start:dev

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: pmtb-umami
    ports:
      - "3002:3000" # Expõe na porta 3002 para não conflitar com seu backend (3001)
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: 1
    depends_on:
      - db
    networks:
      - pmtb-network
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: pmtb-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:3001
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   networks:
  #     - pmtb-network
  #   command: pnpm run dev

networks:
  pmtb-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bucket_data:
  esdata:
